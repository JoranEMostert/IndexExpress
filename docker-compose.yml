services:
  searxng:
    image: searxng/searxng:latest
    container_name: expressindex-searxng
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-changeme123}
      - SEARXNG_DEFAULT_LANG=en
      - SEARXNG_INSTANCE_NAME=expressindex-search
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:Z
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: expressindex-mcp-server
    network_mode: host
    environment:
      - SEARXNG_URL=${SEARXNG_URL:-http://localhost:8888}
      - LLM_API_URL=${LLM_API_URL:-http://localhost:1234/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-0}
      - LLM_MAX_PARALLEL=${LLM_MAX_PARALLEL:-4}
      - LLM_RETRIES=${LLM_RETRIES:-2}
      - MAX_CONCURRENT_AGENTS=${MAX_CONCURRENT_AGENTS:-7}
      - PEEK_MAX_URLS=${PEEK_MAX_URLS:-5}
      - SKIM_MAX_URLS=${SKIM_MAX_URLS:-15}
      - SKIM_AGENT_COUNT=${SKIM_AGENT_COUNT:-1}
      - ANALYZE_SOURCES_PER_AGENT=${ANALYZE_SOURCES_PER_AGENT:-12}
      - ANALYZE_AGENT_COUNT=${ANALYZE_AGENT_COUNT:-2}
      - ANALYZE_CONTRADICTION_AGENTS=${ANALYZE_CONTRADICTION_AGENTS:-0}
      - RESEARCH_MAX_SUB_QUERIES=${RESEARCH_MAX_SUB_QUERIES:-}
      - RESEARCH_SOURCES_PER_SUB_QUERY=${RESEARCH_SOURCES_PER_SUB_QUERY:-8}
      - SEARXNG_TIMEOUT=${SEARXNG_TIMEOUT:-0}
      - SEARXNG_RETRIES=${SEARXNG_RETRIES:-2}
      - QUERY_MAX_LENGTH=${QUERY_MAX_LENGTH:-600}
      - READINESS_REQUIRE_LLM=${READINESS_REQUIRE_LLM:-true}
      - TOOL_TIMEOUT_PEEK=${TOOL_TIMEOUT_PEEK:-30}
      - TOOL_TIMEOUT_SKIM=${TOOL_TIMEOUT_SKIM:-120}
      - TOOL_TIMEOUT_ANALYZE=${TOOL_TIMEOUT_ANALYZE:-300}
      - TOOL_TIMEOUT_RESEARCH=${TOOL_TIMEOUT_RESEARCH:-900}
      - HTTP_RETRY_BASE_MS=${HTTP_RETRY_BASE_MS:-250}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-text}
    volumes:
      - ./mcp-server:/app:Z
      - ./expressindex_core:/app/expressindex_core:Z
      - mcp-data:/app/data
    depends_on:
      searxng:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  mcp-data:

networks:
  mcp-network:
    driver: bridge
