[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "expressindex"
version = "0.1.0"
description = "ExpressIndex CLI and TUI for local MCP research tiers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9.0",
  "prompt_toolkit>=3.0.43",
  "rich>=13.7.0",
]

[project.scripts]
expressindex = "expressindex_cli.main:main"

[tool.setuptools]
packages = ["expressindex_cli", "expressindex_core"]

[tool.pytest.ini_options]
pythonpath = [".", "mcp-server"]
